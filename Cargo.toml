[package]
name = "titan_voxel_engine"
version = "0.4.0"
edition = "2021"

[dependencies]
glam = { version = "0.30", features = ["bytemuck"] }
rayon = "1.10"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
winit = "0.30"
wgpu = "23"
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
image = "0.25"         # Para decodificar PNG/JPG
reqwest = { version = "0.12", features = ["blocking"] } # Para descargar archivos
anyhow = "1.0"