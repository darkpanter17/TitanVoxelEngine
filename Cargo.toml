[package]
name = "titan_voxel_engine"
version = "0.4.0"
edition = "2021"

[dependencies]
glam = { version = "0.24", features = ["bytemuck"] }
rayon = "1.8"
mlua = { version = "0.8", features = ["lua54", "vendored"] }
bitflags = "2.4"
winit = "0.29"
wgpu = "0.19"
pollster = "0.3"
env_logger = "0.11"
log = "0.4"
bytemuck = { version = "1.14", features = ["derive"] }
image = "0.24"         # Para decodificar PNG/JPG
reqwest = { version = "0.11", features = ["blocking"] } # Para descargar archivos
anyhow = "1.0"